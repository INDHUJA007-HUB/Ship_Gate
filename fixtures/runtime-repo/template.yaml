AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  Reader:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: app.handler
      CodeUri: .
      Timeout: 10
      MemorySize: 128
      Role: arn:aws:iam::000000000000:role/demo
      Environment:
        Variables:
          DDB_ENDPOINT: http://ddb:8000
          S3_ENDPOINT: http://minio:9000
  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadPhotos
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:*', 'dynamodb:*']
                Resource: '*'
