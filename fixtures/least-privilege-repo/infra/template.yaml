AWSTemplateFormatVersion: '2010-09-09'
Description: Phase 7 fixture. The upload role grants far more than the code calls.
Resources:
  UploadFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OverBroadUploadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource: '*'
              - Effect: Allow
                Action: dynamodb:*
                Resource: '*'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: 'arn:aws:sqs:us-east-1:123456789012:upload-events'
