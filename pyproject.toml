[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "first-commit"
version = "0.1.0"
description = "Evidence-first shipping-safety checks for AI-generated code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "First Commit contributors" }]
dependencies = ["PyYAML>=6.0.2", "cedarpy==4.8.7"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
first-commit = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pytest-tmp", ".test-temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
